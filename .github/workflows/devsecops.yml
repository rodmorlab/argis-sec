name: DevSecOps CI/CD Pipeline - AegisSec Enterprise

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  # =========================================================================
  # STAGE 1: BUILD & INTEGRACIÓN AUTOMATIZADA (Node.js + Supertest + MongoDB)
  # =========================================================================
  build-and-test:
    name: 1. Build & Automated Security Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    env:
      NODE_ENV: test
      PORT: 4000
      MONGO_URI: mongodb://127.0.0.1:27017/aegissec_ci_test_db
      MONGO_SECURITY_TEST_URI: mongodb://127.0.0.1:27017/aegissec_ci_security_db
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci_ephemeral_jwt_secret_key_min_32_characters_2026' }}
      JWT_EXPIRES_IN: 1h
      FRONTEND_URL: http://localhost:5500
      INSTITUTIONAL_INBOX: contacto@aegissec.cl

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias deterministas (npm ci)
        run: npm ci

      - name: Verificar sintaxis del frontend y backend
        working-directory: .
        run: |
          node --check app.js
          node --check backend/src/app.js
          node --check backend/src/server.js

      - name: Ejecutar suite de pruebas de integración y seguridad (Supertest)
        run: npm test

  # =========================================================================
  # STAGE 2: SCA - AUDITORÍA DE DEPENDENCIAS (Bloqueo ante severidad High/Critical)
  # =========================================================================
  sca-dependency-audit:
    name: 2. SCA Dependency Audit (npm audit)
    runs-on: ubuntu-latest
    needs: [build-and-test]

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Ejecutar auditoría de vulnerabilidades SCA (Umbral High/Critical y Producción)
        run: |
          npm audit --audit-level=high
          npm audit --omit=dev

  # =========================================================================
  # STAGE 3: SAST - ANÁLISIS ESTÁTICO DE SEGURIDAD CON GITHUB CODEQL
  # =========================================================================
  sast-codeql:
    name: 3. SAST Static Analysis (GitHub CodeQL)
    runs-on: ubuntu-latest
    needs: [sca-dependency-audit]

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Inicializar GitHub CodeQL para JavaScript
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-extended

      - name: Ejecutar análisis estático CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"

  # =========================================================================
  # STAGE 4: CD - DESPLIEGUE CONTINUO SEGURO A PRODUCCIÓN (Render / Vercel)
  # =========================================================================
  deploy-production:
    name: 4. Continuous Deployment to Production (HTTPS)
    runs-on: ubuntu-latest
    needs: [build-and-test, sca-dependency-audit, sast-codeql]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Disparar Deploy Hook de Producción (Render / Vercel)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Aviso: El secreto RENDER_DEPLOY_HOOK_URL no está configurado en el repositorio."
            echo "Todos los controles de calidad y seguridad (Tests, SCA, CodeQL) aprobaron exitosamente."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Despliegue en producción disparado exitosamente."
